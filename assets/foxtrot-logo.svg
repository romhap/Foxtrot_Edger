<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <!-- LEFT EAR -->
  <path d="M48 28 L90 100 L24 88 Z" fill="#d10070"/>
  <path d="M55 40 L86 96 L34 86 Z" fill="#ff2d87"/>

  <!-- RIGHT EAR -->
  <path d="M192 28 L150 100 L216 88 Z" fill="#d10070"/>
  <path d="M185 40 L154 96 L206 86 Z" fill="#ff2d87"/>

  <!-- HEAD (round) -->
  <ellipse cx="120" cy="142" rx="96" ry="92" fill="#ff2d87"/>

  <!-- Subtle left/right shading for depth -->
  <ellipse cx="108" cy="140" rx="90" ry="88" fill="#ff4a9a" opacity="0.35"/>

  <!-- WHITE FACE CHEVRON (V-shape from forehead to chin) -->
  <path d="M74 112 L120 136 L166 112 L120 218 Z" fill="#ffffff"/>
  <!-- Subtle right-side shading on white -->
  <path d="M120 136 L166 112 L120 218 Z" fill="#ffd6ea" opacity="0.45"/>

  <!-- LEFT EYE (angular slant) -->
  <path d="M68 120 L100 134 L96 148 L68 138 Z" fill="#140010"/>
  <!-- Eye shine -->
  <ellipse cx="80" cy="132" rx="4" ry="3" fill="#ffffff" opacity="0.25"/>

  <!-- RIGHT EYE (angular slant) -->
  <path d="M172 120 L140 134 L144 148 L172 138 Z" fill="#140010"/>
  <ellipse cx="160" cy="132" rx="4" ry="3" fill="#ffffff" opacity="0.25"/>

  <!-- NOSE -->
  <path d="M110 168 L130 168 L120 182 Z" fill="#140010"/>
</svg>
